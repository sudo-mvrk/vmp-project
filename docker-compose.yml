# Variables come from .env in this directory (see .env.example).
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRE_DB:?set POSTGRE_DB in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./backend/src/main/resources/init-db/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro


  redis:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "6380:6379"
    volumes:
      - ./redisdata:/data
    restart: unless-stopped


  spring-boot-app:
    build:
      context: ./backend
    restart: on-failure
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      # Inside the compose network the services are reached by name, not through localhost.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRE_DB}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
